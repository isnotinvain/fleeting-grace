[project]
name = "fleeting-grace"
version = "0.1.0"
description = "Generates nice looking 3 Body Problem simulations and turns them into 3D models for 3D printing"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy",
    "matplotlib",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "ruff>=0.14.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fleeting_grace"]

[tool.ruff]
line-length = 150
indent-width = 4
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
