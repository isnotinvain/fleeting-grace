<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3-Body Trajectory Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #fff;
            overflow: hidden;
        }
        #container {
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 14px;
            max-width: 320px;
            backdrop-filter: blur(10px);
        }
        #info h1 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #fff;
        }
        #info p {
            margin: 5px 0;
            color: #aaa;
        }
        #info .label {
            color: #666;
        }
        #info .value {
            color: #fff;
        }
        #scores {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #333;
        }
        .score-bar {
            margin: 8px 0;
        }
        .score-label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 3px;
        }
        .score-track {
            height: 6px;
            background: #222;
            border-radius: 3px;
            overflow: hidden;
        }
        .score-fill {
            height: 100%;
            border-radius: 3px;
        }
        .legend {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #333;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }
        .legend-color {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        #navigation {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        #counter {
            font-size: 14px;
            color: #888;
            min-width: 80px;
            text-align: center;
        }
        #save-btn {
            background: rgba(78, 205, 196, 0.2);
            border: 1px solid rgba(78, 205, 196, 0.4);
        }
        #save-btn:hover {
            background: rgba(78, 205, 196, 0.3);
        }
        #controls {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #555;
        }
        #toast {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(78, 205, 196, 0.9);
            color: #000;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        #toast.show {
            opacity: 1;
        }
    </style>
</head>
